# Sol convergence check (C=50, prefix 0), 2026-11-20. GPT-6.2 Sol (Low) has only 35 board fixtures and has never
# played Luna or Hydrogen, two of the Inspect panel opponents it scored well against (Inspect parity run: 1623 +/- 107
# vs board 1362). 6 fresh secrets each vs GPT-6 Luna (Medium) and Gemini 4 Hydrogen (Low), both directions, through
# the arena code. Model configs copied verbatim from the existing C=50 runs so the run can be combined.
name: ladder-sol-check-c50
fixture_data: false
protocol:
  version: contact-v0.5
  dictionary_access: lookup_tools
  blocklist_encoding: words_and_ranges
  initial_prefix_length: 0
  max_tool_calls_per_decision: 8
  turn_limit: 30
  clue_max_characters: 50
lexicon:
  manifest: lexicons/enable_manifest.json
scoring:
  development_rollouts: 256
tasks:
  tasks_per_pair: 6
  generation_seed: 47
tournament:
  schedule: pairs
  pairs:
  - - gpt_6_2_sol
    - gpt_6_luna
  - - gpt_6_2_sol
    - gemini_4_hydrogen
models:
- id: gpt_6_2_sol
  provider: openai
  api_family: responses
  model: gpt-6.2-sol
  parameters:
    reasoning:
      effort: low
  credential_env: OPENAI_API_KEY
  max_output_tokens: 8000
  context_window_tokens: 1000000
  prices:
    as_of: '2026-11-18'
    source: GPT-6.2 launch coverage (third-party, 2026-11-17); model ID verified via
      models.list
    input_per_mtok: 2.0
    output_per_mtok: 10.0
    cached_input_per_mtok: 0.1
- id: gpt_6_luna
  provider: openai
  api_family: responses
  model: gpt-6-luna
  parameters: {}
  credential_env: OPENAI_API_KEY
  max_output_tokens: 8000
  context_window_tokens: 1050000
  prices:
    as_of: '2026-11-17'
    source: third-party trackers; model ID verified via OpenAI models.list 2026-11-17
    input_per_mtok: 0.1
    output_per_mtok: 0.5
    cached_input_per_mtok: 0.01
- id: gemini_4_hydrogen
  provider: google
  api_family: generate_content
  model: gemini-4-hydrogen
  parameters:
    thinking_config:
      thinking_level: low
  credential_env: GEMINI_API_KEY
  max_output_tokens: 8000
  context_window_tokens: 1000000
  prices:
    as_of: '2026-11-17'
    source: Google announcement via third-party trackers; model ID verified via models.list;
      cached rate set conservatively at 25% of input (trackers list $0.075)
    input_per_mtok: 1.5
    output_per_mtok: 7.5
    cached_input_per_mtok: 0.375
execution:
  global_concurrency: 8
  per_provider_concurrency: 6
  game_concurrency: 6
analysis:
  bootstrap_resamples: 2000
  development_bootstrap_resamples: 500
