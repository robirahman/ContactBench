# C=50 human challenge (main format): one fixture (attack + defend on one fresh secret) vs GPT-6 Luna
# (Medium, the provider default; no effort parameter is sent, as on the main board). Luna's config is copied
# verbatim from the main C=50 runs so the result can be anchored to the main board (analyze --anchor).
name: human-challenge-c50
fixture_data: false
protocol:
  version: contact-v0.5
  dictionary_access: lookup_tools
  blocklist_encoding: words_and_ranges
  initial_prefix_length: 0
  max_tool_calls_per_decision: 8
  turn_limit: 30
  clue_max_characters: 50
lexicon:
  manifest: lexicons/enable_manifest.json
scoring:
  development_rollouts: 256
tasks:
  tasks_per_pair: 1
tournament:
  schedule: human_challenge
  rematch_on_no_progress_draw: false
  human_challenge:
    player: human
    opponents:
    - gpt_6_luna
models:
- id: human
  provider: human
  display_name: Human player
- id: gpt_6_luna
  provider: openai
  api_family: responses
  model: gpt-6-luna
  parameters: {}
  credential_env: OPENAI_API_KEY
  max_output_tokens: 8000
  context_window_tokens: 1050000
  prices:
    as_of: '2026-11-17'
    source: third-party trackers; model ID verified via OpenAI models.list 2026-11-17
    input_per_mtok: 0.1
    output_per_mtok: 0.5
    cached_input_per_mtok: 0.01
execution:
  game_concurrency: 1
  global_concurrency: 4
  per_provider_concurrency: 2
analysis:
  bootstrap_resamples: 0
  development_bootstrap_resamples: 0
