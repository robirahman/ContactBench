# Low-effort ladder (C=50, empty starting prefix), 2026-11-18. Inter-group links (5 secrets each, seed 44): top-upper (same-provider pairs plus Fable-Sol, Astra-Argon), upper-mid (Opus-Sonnet, Sol-Terra, Opus-Hydrogen), small-mid (Flash-Hydrogen, Flash-Terra). Existing runs already link Argon-Sonnet/Terra and the small and mid tiers.
# Model ids without an effort suffix are the low-effort entries; other effort levels get their own ids (e.g. _max).
name: ladder-bridges-c50
fixture_data: false
protocol:
  version: contact-v0.5
  dictionary_access: lookup_tools
  blocklist_encoding: words_and_ranges
