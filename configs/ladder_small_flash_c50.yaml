# Low-effort ladder (C=50, empty starting prefix), 2026-11-18. Small group completion: Gemini 3.8 Flash vs Claude Haiku 5.5 and GPT-6 Luna (Haiku-Luna is in leaderboard_latest_small_c50).
# Model ids without an effort suffix are the low-effort entries; other effort levels get their own ids (e.g. _max).
name: ladder-small-flash-c50
fixture_data: false
protocol:
  version: contact-v0.5
  dictionary_access: lookup_tools
  blocklist_encoding: words_and_ranges
  initial_prefix_length: 0
  max_tool_calls_per_decision: 8
  turn_limit: 30
  clue_max_characters: 50
lexicon:
  manifest: lexicons/enable_manifest.json
scoring:
  development_rollouts: 256
tasks:
  tasks_per_pair: 10
  generation_seed: 41
tournament:
  schedule: pairs
  pairs:
  - - claude_haiku_5_5
    - gemini_3_8_flash
  - - gpt_6_luna
    - gemini_3_8_flash
models:
- id: claude_haiku_5_5
  provider: anthropic
  model: claude-haiku-5-5
  parameters:
    effort: low
  credential_env: ANTHROPIC_API_KEY
  max_output_tokens: 8000
  context_window_tokens: 1000000
  prices:
    as_of: '2026-11-03'
    source: Anthropic model table (claude-api skill)
    input_per_mtok: 0.1
    output_per_mtok: 0.5
    cached_input_per_mtok: 0.01
    cache_write_per_mtok: 0.125
- id: gpt_6_luna
  provider: openai
  api_family: responses
  model: gpt-6-luna
  parameters: {}
  credential_env: OPENAI_API_KEY
  max_output_tokens: 8000
  context_window_tokens: 1050000
  prices:
    as_of: '2026-11-17'
    source: third-party trackers; model ID verified via OpenAI models.list 2026-11-17
    input_per_mtok: 0.1
    output_per_mtok: 0.5
    cached_input_per_mtok: 0.01
- id: gemini_3_8_flash
  provider: google
  api_family: generate_content
  model: gemini-3.8-flash
  parameters: {}
  credential_env: GEMINI_API_KEY
  max_output_tokens: 8000
  context_window_tokens: 1000000
  prices:
    as_of: '2026-11-18'
    source: third-party trackers; conservative (post-2026-12-01 / higher reported)
      rates; model ID verified via models.list
    input_per_mtok: 1.5
    output_per_mtok: 7.5
    cached_input_per_mtok: 0.375
execution:
  global_concurrency: 8
  per_provider_concurrency: 6
  game_concurrency: 6
analysis:
  bootstrap_resamples: 2000
  development_bootstrap_resamples: 500
